# github-repo-stats — advanced repository traffic analysis & reporting
# (https://github.com/jgehrcke/github-repo-stats)
#
# PRIVACY BY DESIGN: this workflow runs with a READ-ONLY GITHUB_TOKEN
# (`contents: read`), so the tool CANNOT commit/push its report back into the
# repository — the report never becomes a public file. It is uploaded as a
# workflow ARTIFACT instead, which only people with access to this repository's
# Actions can download. (On a public repo that still means "anyone who can read
# the repo", but nothing is stored in the tree; on a private repo it is private.)
#
# Run once manually (Actions -> github-repo-stats -> Run workflow) to see the
# first report, then let the daily schedule accumulate history. Note: GitHub's
# traffic API only covers the last 14 days, so trends grow over weeks, not days.

name: github-repo-stats

on:
  schedule:
    - cron: '0 0 * * *'   # daily 00:00 UTC
  workflow_dispatch: {}   # allow manual runs

# Read-only: the tool's own commit/push step is rejected, keeping the report
# out of the repository tree.
permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run github-repo-stats
        uses: jgehrcke/github-repo-stats@v1.4.2
        # The tool tries to commit+push its report; with a read-only token that
        # push is refused and the tool may exit non-zero. `continue-on-error`
        # keeps the job green while the generated files are still collected
        # below. The traffic data itself is fetched fine with read access.
        continue-on-error: true
        with:
          ghtoken: ${{ secrets.GITHUB_TOKEN }}
          # Dedicated branch name only matters when the token CAN push; with a
          # read-only token nothing is pushed anywhere. Kept explicit for the
          # day a write token is intentionally used.
          databranch: stats

      - name: Upload report artifact (downloadable from this run's page)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-repo-stats-report
          path: github-repo-stats/
          retention-days: 90
          if-no-files-found: warn
