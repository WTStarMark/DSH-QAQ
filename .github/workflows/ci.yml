name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The dsh-qaq plugin's lib/ is generated (not committed). Rebuild it into a
      # throwaway dir and assert it matches the installed copy — catches partial /
      # stale plugin builds and any non-determinism in the emitter.
      - name: Plugin lib sync check
        run: pnpm check:plugin-lib

      - name: Unit tests
        run: pnpm test

      # The real-DSH integration segment of smoke only runs when a checkout is
      # provided (QAQ_SMOKE_DSH_HOME); without one it degrades gracefully and
      # still passes — exactly the self-adaptation CI should verify.
      - name: Smoke regression
        run: pnpm smoke
